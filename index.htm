<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lordnine JP Boss Tracker - Strangerz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-text">
            <h1>LORDNINE BOSS SPAWN TRACKER</h1>
            <p id="jst-time-display" class="server-time">Server Time (JST): --:--:--</p>
        </div>
        <input type="text" id="search-boss" placeholder="Search boss, level or map...">
    </header>

    <div class="main-layout">
        <div class="boss-list-container">
            <div class="section-header">
                <h2>WORLD BOSSES</h2>
            </div>
            <div id="bosses-container">
                </div>
        </div>

        <div class="active-timers-container">
            <div class="section-header">
                <h2>ACTIVE TIMERS</h2>
            </div>
            <div id="active-timers-display">
                <p class="no-timers">No active timers.</p>
            </div>
            <div class="footer-actions">
                <div class="guild-tag">GUILD: STRANGERZ</div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
