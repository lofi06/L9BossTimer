<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lordnine JP Boss Tracker - Strangerz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════
         PANTALLA DE BIENVENIDA
         Se muestra antes del tracker. El usuario elige entre
         USER (sin contraseña) o ADMIN (requiere PIN de 4 dígitos).
         Se oculta con display:none cuando el modo es confirmado.
    ═══════════════════════════════════════════════════════ -->
    <div id="welcome-screen">
        <div class="welcome-box">
            <img src="favicon.png" class="welcome-logo" alt="LordNine Logo">
            <h1 class="welcome-title">LORDNINE BOSS TRACKER</h1>
            <p class="welcome-subtitle">Select your access mode</p>

            <div class="welcome-buttons">
                <button class="welcome-btn user-btn" onclick="enterAsUser()">
                    <span class="btn-icon">👤</span>
                    <span class="btn-label">USER</span>
                    <span class="btn-desc">View timers</span>
                </button>
                <button class="welcome-btn admin-btn" onclick="showAdminPin()">
                    <span class="btn-icon">🔐</span>
                    <span class="btn-label">ADMIN</span>
                    <span class="btn-desc">Full control</span>
                </button>
            </div>

            <!-- PIN de Admin (oculto hasta que se seleccione ADMIN) -->
            <div id="pin-section" style="display:none;">
                <p class="pin-label">Enter Admin PIN</p>
                <div class="pin-inputs">
                    <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>
                <p id="pin-error" class="pin-error" style="display:none;">Incorrect PIN. Try again.</p>
            </div>

            <p class="welcome-credit">Developed by <span>LOFI</span></p>
        </div>
    </div>

    <!-- TRACKER PRINCIPAL (oculto hasta elegir modo) -->
    <div id="tracker" style="display:none;">
    <header>
        <div class="logo-text">
            <div class="logo-title-row">
                <h1>LORDNINE BOSS SPAWN TRACKER</h1>
                <!-- Badge de rol (USER/ADMIN) — se inserta aquí por JS al elegir modo -->
                <span id="role-badge-slot"></span>
            </div>
            <p id="jst-time-display" class="server-time">Server Time (UTC+9): --:--:--</p>
        </div>
        <div class="header-right">
            <input type="text" id="search-boss" placeholder="Search boss, level or map...">
            <!-- Menú de acciones admin — solo visible si el rol es ADMIN -->
            <div id="admin-menu-wrapper" class="admin-menu-wrapper" style="display:none;">
                <button class="admin-menu-btn" onclick="toggleAdminMenu()">⚙️ ADMIN ▾</button>
                <div id="admin-dropdown" class="admin-dropdown" style="display:none;">
                    <button class="admin-action-btn danger" onclick="clearAllTimers()">
                        🗑️ Clear All Timers
                        <span class="action-desc">Remove all interval boss timers</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <div class="boss-list-container">
            <div class="section-header">
                <h2>WORLD BOSSES</h2>
            </div>
            <div id="bosses-container">
                </div>
        </div>

        <div class="active-timers-container">
            <div class="section-header">
                <h2>ACTIVE TIMERS</h2>
            </div>
            <!-- Next Boss — card destacada con el boss más próximo a spawnear -->
            <div id="next-boss-card" class="next-boss-card" style="display:none;">
                <img id="next-boss-img" class="next-boss-img" src="" alt="">
                <div class="next-boss-info">
                    <div class="next-boss-label">⚡ NEXT SPAWN</div>
                    <div id="next-boss-name" class="next-boss-name">—</div>
                    <div id="next-boss-location" class="next-boss-location">—</div>
                </div>
                <div>
                    <div id="next-boss-countdown" class="next-boss-countdown">—</div>
                    <div id="next-boss-time" class="next-boss-time">—</div>
                </div>
            </div>

            <div id="active-timers-display">
                <p class="no-timers">No active timers.</p>
            </div>
            <div class="footer-actions">
                <div class="guild-tag">DEVELOPED BY <span>LOFI</span></div>
            </div>
        </div>
    </div>

    </div><!-- /#tracker -->

    <script type="module" src="script.js"></script>
</body>
</html>
