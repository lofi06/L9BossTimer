<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lordnine Boss Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="role-selection-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; display:none; justify-content:center; align-items:center; flex-direction:column; font-family:'Cinzel', serif; text-align:center;">
        <h2 style="color:#ffcc00; margin-bottom:30px; letter-spacing: 2px;">SELECT YOUR ROLE</h2>
        <div style="display:flex; gap:25px;">
            <button onclick="window.askAdminPassword()" style="padding:15px 40px; background:#ffcc00; color:black; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">ADMIN</button>
            <button onclick="window.setRole('user')" style="padding:15px 40px; background:#444; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">USER</button>
        </div>
        <p style="color: #888; margin-top: 20px; font-family: 'Roboto'; font-size: 0.9em;">Admin can clear active timers. User can mark and set times.</p>
    </div>

    <header>
        <div class="logo-text">
            <h1>LORDNINE BOSS SPAWN TRACKER</h1>
            <p id="local-time-display">Local Time: --:--:--</p>
        </div>
        <input type="text" id="search-boss" placeholder="Search boss or location...">
    </header>

    <div class="main-layout">
        <div class="boss-list-container">
            <h2>Boss List</h2>
            <div id="bosses-container"></div>
            <div class="list-end-padding"></div>
        </div>

        <div class="active-timers-container">
            <h2>Active Timers</h2> 
            <div id="active-timers-display">
                <p class="no-timers">No active timers.</p>
            </div>
            <div class="footer-actions">
                <p id="role-status">Mode: Loading...</p>
                <button onclick="window.logout()" style="background:none; border:none; color:#888; text-decoration:underline; cursor:pointer; font-size:0.8em;">Change Role</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
